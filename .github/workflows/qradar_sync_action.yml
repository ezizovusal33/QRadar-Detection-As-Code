name: QRadar Detection-as-Code Sync

on:
  push:
    branches:
      - main
    paths:
      - 'qradar/rules/**'
      - 'scripts/**'

jobs:
  sync-to-qradar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests urllib3

      - name: Run QRadar Sync Script
        env:
          QRADAR_IP: ${{ secrets.QRADAR_IP }}
          QRADAR_TOKEN: ${{ secrets.QRADAR_TOKEN }}
        run: |
          python scripts/qradar_sync_pipeline.py
